<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="dsh-aihub — 一个模型名，多家供应方，挂了自动换">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1730"/>
      <stop offset="1" stop-color="#131f3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3f6bff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3f6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#37d6c0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#37d6c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9c2ff"/>
      <stop offset="0.5" stop-color="#7f9dff"/>
      <stop offset="1" stop-color="#4ed6c6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f8dff"/>
      <stop offset="1" stop-color="#3ad8c4"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <circle cx="1010" cy="200" r="260" fill="url(#glow)"/>
  <circle cx="180" cy="380" r="240" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="28" fill="none" stroke="#1d2a45"/>

  <!-- left: identity -->
  <text x="72" y="98" fill="#64789f" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" letter-spacing="4.5">DEEPSEEK HARNESS PLUGIN</text>
  <text x="70" y="192" fill="url(#title)" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="82" font-weight="700" letter-spacing="-1">dsh-aihub</text>
  <text x="72" y="240" fill="#a8b8d8" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24">一个模型名，多家供应方，挂了自动换</text>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14">
    <rect x="72" y="280" width="112" height="34" rx="17" fill="#111c33" stroke="#233657"/>
    <text x="128" y="302" fill="#93a6c8" text-anchor="middle">自动切换</text>
    <rect x="196" y="280" width="104" height="34" rx="17" fill="#111c33" stroke="#233657"/>
    <text x="248" y="302" fill="#93a6c8" text-anchor="middle">30s 冷却</text>
    <rect x="312" y="280" width="96" height="34" rx="17" fill="#111c33" stroke="#233657"/>
    <text x="360" y="302" fill="#93a6c8" text-anchor="middle">零依赖</text>
  </g>

  <!-- right: one route, several suppliers -->
  <g>
    <circle cx="1010" cy="200" r="128" fill="none" stroke="#1e2c49" stroke-dasharray="3 7"/>
    <line x1="1010" y1="200" x2="1103" y2="110" stroke="#3ddc97" stroke-opacity="0.75" stroke-width="2"/>
    <line x1="1010" y1="200" x2="1136" y2="200" stroke="#3ddc97" stroke-opacity="0.75" stroke-width="2"/>
    <line x1="1010" y1="200" x2="1103" y2="290" stroke="#ff6b6b" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="7 6"/>
    <circle cx="1103" cy="110" r="9" fill="#3ddc97"/>
    <circle cx="1136" cy="200" r="9" fill="#3ddc97"/>
    <circle cx="1103" cy="290" r="9" fill="#ff6b6b"/>
    <circle cx="1010" cy="200" r="56" fill="#0f1b30" stroke="url(#ring)" stroke-width="2"/>
    <text x="1010" y="207" fill="#e6eeff" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="600">aihub</text>
    <text x="1010" y="356" fill="#5f7398" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" letter-spacing="2">ONE ROUTE · MANY SUPPLIERS</text>
  </g>
</svg>
